[project]
name = "spm-migration"
version = "0.1.0"
description = "Asana + Adaptive Work to ServiceNow SPM migration pipeline"
requires-python = ">=3.10"
dependencies = ["requests>=2.31", "PyYAML>=6.0", "openpyxl>=3.1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
